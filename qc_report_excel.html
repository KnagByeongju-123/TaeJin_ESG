<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출하검사 성적서 엑셀 다운로드 v0.45 (테스트용)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:'Noto Sans KR',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding-bottom:40px}
    .hdr{background:linear-gradient(135deg,#0c4a6e,#0369a1);padding:18px 16px 14px;text-align:center}
    .hdr h1{font-size:18px;font-weight:900}
    .hdr p{font-size:11px;color:#7dd3fc;margin-top:3px}
    .form-wrap{max-width:820px;margin:0 auto;padding:12px}
    .card{background:#1e293b;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:16px;margin-bottom:12px}
    .card-title{font-size:13px;font-weight:700;color:#38bdf8;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .card-title::before{content:"";width:3px;height:14px;background:#38bdf8;border-radius:2px}
    .fg{margin-bottom:12px}.fg:last-child{margin-bottom:0}
    .fg label{display:block;font-size:11px;color:#94a3b8;margin-bottom:5px}
    .fg input,.fg select{width:100%;padding:10px 12px;font-size:13px;font-family:inherit;background:#0f172a;border:1.5px solid #475569;border-radius:8px;color:#e2e8f0}
    .fg input:focus,.fg select:focus{outline:none;border-color:#38bdf8}
    .btn{display:inline-block;padding:11px 16px;font-size:14px;font-weight:700;border:none;border-radius:8px;cursor:pointer;font-family:inherit;width:100%}
    .btn:active{transform:scale(.98)}
    .btn-primary{background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff}
    .btn-success{background:linear-gradient(135deg,#059669,#34d399);color:#fff;padding:14px;font-size:15px}
    .btn-add{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .info-box{padding:10px 12px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.2);border-radius:8px;font-size:12px;color:#94a3b8;line-height:1.6}
    .warn-box{padding:10px 12px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:8px;font-size:12px;color:#fbbf24;line-height:1.6;margin-bottom:10px}
    .small{font-size:11px;color:#64748b}
    .log{font-family:"Courier New",monospace;font-size:11px;color:#94a3b8;background:#0f172a;padding:10px;border-radius:6px;max-height:240px;overflow-y:auto;line-height:1.7}
    .log .ok{color:#86efac}.log .err{color:#fca5a5}.log .head{color:#38bdf8;font-weight:700}.log .warn{color:#fcd34d}
    .row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media (max-width:600px){.row-2{grid-template-columns:1fr}}
    .progress{height:8px;background:#0f172a;border-radius:4px;overflow:hidden;margin:8px 0 4px}
    .progress-fill{height:100%;background:linear-gradient(135deg,#0284c7,#38bdf8);transition:width .3s;width:0}
    
    /* 출하 부품 카드 */
    .ship-list{margin-top:8px}
    .ship-card{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .ship-card.no-data{border-color:#dc2626;background:rgba(239,68,68,.04)}
    .ship-card.no-drawing{border-color:#f59e0b;background:rgba(245,158,11,.04)}
    .ship-card.with-data.with-drawing{border-color:#22c55e;background:rgba(34,197,94,.04)}
    /* [v0.39] NG 강조 — 다른 상태색보다 우선(빨강). 임포트 데이터에 NG 항목 있으면 한눈에 */
    .ship-card.ng{border-color:#dc2626 !important;background:rgba(239,68,68,.12) !important;box-shadow:0 0 0 1px #dc2626}
    .ship-status.st-ng{background:#dc2626;color:#fff}
    .ng-flag{color:#f87171 !important;font-weight:800}
    .ship-info{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .ship-info input[type="checkbox"]{width:18px;height:18px;accent-color:#38bdf8;cursor:pointer;flex-shrink:0}
    .ship-pn{font-weight:700;color:#e2e8f0;font-size:13px}
    .ship-meta{font-size:11px;color:#94a3b8;display:flex;gap:8px;flex-wrap:wrap}
    .ship-meta strong{color:#7dd3fc}
    .ship-status{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:700;flex-shrink:0;white-space:nowrap}
    .st-ok{background:#dcfce7;color:#166534}
    .st-no-data{background:#fee2e2;color:#991b1b}
    .st-no-drawing{background:#fef3c7;color:#92400e}
    .empty-list{text-align:center;padding:30px 12px;color:#64748b;font-size:12px;border:1px dashed #334155;border-radius:8px}
    .toolbar{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
    .toolbar button{padding:6px 10px;font-size:11px;border:1px solid #475569;background:#0f172a;color:#94a3b8;border-radius:4px;cursor:pointer;font-family:inherit}
    .toolbar button:hover{border-color:#38bdf8;color:#38bdf8}
    .toolbar .count{margin-left:auto;color:#94a3b8;font-size:11px;font-weight:600;align-self:center}
    
    .stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .stat{flex:1;min-width:100px;padding:10px;background:#0f172a;border-radius:8px;text-align:center;border:1px solid #334155}
    .stat-num{font-size:20px;font-weight:900;color:#38bdf8}
    .stat-num.ok{color:#22c55e}
    .stat-num.warn{color:#fbbf24}
    .stat-num.err{color:#ef4444}
    .stat-lbl{font-size:10px;color:#64748b;margin-top:2px}
  </style>
</head>
<body>

<div class="hdr">
  <h1>📊 출하검사 성적서 엑셀 다운로드 <span style="font-size:11px;font-weight:600;color:#7dd3fc;background:rgba(255,255,255,.1);padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle">v0.45</span></h1>
  <p>출하의뢰서 → 프레스 + 가공 검사 자동 머지 → 다운로드</p>
</div>

<div class="form-wrap">

  <!-- 1. 출하이력 불러오기 -->
  <div class="card">
    <div class="card-title">🔧 출하이력 불러오기</div>
    <div class="fg" style="margin-bottom:10px">
      <label>회사</label>
      <select id="companySel" onchange="onCompanyChange()">
        <option value="SKF">SKF 씰</option>
        <option value="우창산업">우창산업</option>
        <option value="부강스프링">부강스프링</option>
        <option value="일진글로벌">일진글로벌</option>
      </select>
    </div>
    <button type="button" class="btn btn-primary" onclick="reload()">🔌 출하이력 불러오기</button>
    <div id="connStatus" class="small" style="margin-top:8px"></div>
  </div>

  <!-- 부품번호 매핑 관리 (접이식) -->
  <div class="card" id="aliasMgrCard" style="display:none">
    <div class="card-title" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="toggleAliasMgr()">
      <span>⚙️ 부품번호 매핑 관리</span>
      <span id="aliasMgrArrow" style="transition:transform .2s">▾</span>
    </div>
    <div id="aliasMgrBody" style="display:none;margin-top:10px">
      <div class="small" style="color:#94a3b8;margin-bottom:10px">출하번호와 qc_part 부품번호가 다를 때 매핑. 잘못 매핑한 건 여기서 수정/삭제.</div>
      <div id="aliasMgrList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px"></div>
      <div style="border-top:1px solid #334155;padding-top:10px">
        <div class="small" style="color:#cbd5e1;margin-bottom:6px;font-weight:700">＋ 수동 추가</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <input type="text" id="aliasNewShip" placeholder="출하번호 (예: 1888-0005)"
            style="flex:1;min-width:140px;padding:8px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#fff;font-size:13px">
          <input type="text" id="aliasNewQc" placeholder="qc_part 번호 (예: 1888-0005-01)"
            style="flex:1;min-width:140px;padding:8px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#fff;font-size:13px">
          <button onclick="addAliasManual()" style="border:none;background:#7c3aed;color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">추가</button>
        </div>
        <div id="aliasMgrMsg" class="small" style="margin-top:6px"></div>
      </div>
    </div>
  </div>

  <!-- 2. 출하일 선택 -->
  <div class="card" id="dateCard" style="display:none">
    <div class="card-title">📅 출하일 선택</div>
    <div class="row-2">
      <div class="fg">
        <label>출하일</label>
        <select id="dateSel" onchange="onDateChange()">
          <option value="">날짜를 선택하세요</option>
        </select>
      </div>
      <div class="fg">
        <label>품질보증책임자</label>
        <input type="text" id="qaResp" value="강 병 주">
      </div>
    </div>
    <div class="fg" style="margin-top:10px">
      <label>검사자 <span style="color:#64748b;font-weight:400">(이름에 맞는 사인 자동 삽입: 오 윤 정 / 오 현 민 / 김 상 기)</span></label>
      <input type="text" id="inspector" value="오 윤 정">
    </div>
  </div>

  <!-- 3. 출하 부품 -->
  <div class="card" id="listCard" style="display:none">
    <div class="card-title">📦 출하 부품 (자동 조회됨)</div>
    
    <div id="stats" class="stats" style="display:none"></div>
    
    <div class="toolbar">
      <button onclick="checkAll(true)">전체 선택</button>
      <button onclick="checkAll(false)">전체 해제</button>
      <button onclick="checkOnlyValid()">검사·도면 모두 ✓ 만</button>
      <span class="count" id="selCount">0/0</span>
    </div>
    
    <div id="shipList"><div class="empty-list">출하일을 선택하세요</div></div>
  </div>

  <!-- 4. 다운로드 -->
  <div class="card" id="dlCard" style="display:none">
    <div class="card-title">⬇️ 엑셀 생성 + 다운로드</div>
    <button type="button" class="btn btn-success" onclick="generateXlsx()" id="genBtn">📥 엑셀 다운로드</button>
    <div id="runProgress" style="display:none;margin-top:12px">
      <div class="progress"><div class="progress-fill" id="progFill"></div></div>
      <div id="progLabel" class="small" style="text-align:center;margin-top:6px"></div>
    </div>
  </div>

  <!-- 로그 -->
  <div class="card" id="logCard" style="display:none">
    <div class="card-title">📋 로그</div>
    <div class="log" id="logBox"></div>
  </div>

</div>

// [v0.7] 페이지네이션 자동 처리 — PostgREST max-rows(기본 1000) 제한 우회
//   path 에 limit/offset 포함하지 말 것 (자동으로 추가됨)
async function sbReqAll(path, pageSize = 1000){
  let all = [];
  let offset = 0;
  const sep = path.includes('?') ? '&' : '?';
  while(true){
    const page = await sbReq(`${path}${sep}limit=${pageSize}&offset=${offset}`);
    all = all.concat(page);
    if(page.length < pageSize) break;   // 마지막 페이지 = pageSize 미만
    offset += pageSize;
    if(offset > 100000){ console.warn('sbReqAll: 100000건 초과, 중단'); break; }  // 안전장치
  }
  return all;
}

let _allShipDates = [];        // 출하일별 출하건수 [{date, count}]
let _allShipments = [];        // 모든 shipment_history 행
let _allParts = {};            // part_number → qc_part 한 행 매핑
let _partAlias = {};           // 출하번호 → qc_part 번호 별칭 매핑
let _lastInspByPartId = {};    // part_id → 가장 최근 검사
let _allInspByPartId = {};     // part_id → 전체 프레스검사 배열 (desc 순) [v0.24] 생산일 매칭용
let _machInspByPartId = {};    // part_id → 가공검사 배열 (inspection_date desc 순) [v0.6 추가]
let _specsByPartId = {};       // part_id → spec 배열 [v0.6 추가]
let _shipItems = [];           // 현재 선택된 출하일의 출하 행 + 매칭된 검사

// [v0.22] 출하 부품번호 → qc_part 자동 매칭
//   우선순위: 1)alias 수동매핑  2)정확일치  3)괄호제거  4)-01~-99 접미사 추론
//   반환: {part, matchedNo, how} — how는 매칭 방식(수동/정확/괄호/접미사/실패) 표시용
function resolvePart(rawNo){
  if(!rawNo) return { part:null, matchedNo:null, how:'fail' };
  // 1) alias 수동 매핑 최우선 (사용자가 직접 지정한 건 무조건 신뢰)
  if(_partAlias[rawNo]){
    const p = _allParts[_partAlias[rawNo]];
    return { part:p||null, matchedNo:_partAlias[rawNo], how: p?'수동':'fail' };
  }
  // 2) 정확 일치
  if(_allParts[rawNo]) return { part:_allParts[rawNo], matchedNo:rawNo, how:'정확' };
  // 3) 괄호 제거: "1973-370(375)" → "1973-370"
  const noParen = rawNo.replace(/\([^)]*\)/g, '').trim();
  if(noParen !== rawNo && _allParts[noParen]){
    return { part:_allParts[noParen], matchedNo:noParen, how:'괄호제거' };
  }
  // 4) 접미사 추론: "1551-189" → "1551-189-01" ... "-99"
  //    (괄호 제거한 번호 기준으로 시도)
  const base = noParen || rawNo;
  if(!/-\d{2}$/.test(base)){   // 이미 -NN로 끝나면 접미사 추론 안 함
    for(let n=1; n<=99; n++){
      const cand = base + '-' + String(n).padStart(2,'0');
      if(_allParts[cand]) return { part:_allParts[cand], matchedNo:cand, how:'접미사' };
    }
  }
  return { part:null, matchedNo:null, how:'fail' };
}

// [v0.24] 날짜 문자열(YYYYMMDD 또는 YYYY-MM-DD) → Date. 비교용.
function parseDateStr(s){
  if(!s) return null;
  const digits = String(s).replace(/\D/g,'');
  if(digits.length < 8) return null;
  const y = +digits.slice(0,4), m = +digits.slice(4,6), d = +digits.slice(6,8);
  return new Date(y, m-1, d);
}

// [v0.24] 두 날짜 차이(일). 절댓값 아님 — a-b.
function dayDiff(a, b){
  const da = parseDateStr(a), db = parseDateStr(b);
  if(!da || !db) return Infinity;
  return Math.round((da - db) / 86400000);
}

// [v0.24] 프레스검사: 생산일에 가장 가까운 검사 (앞뒤 무관)
//   생산일 당일이 있으면 그것, 없으면 |검사일 - 생산일| 최소인 것. 동률이면 더 최근(큰 날짜).
function pickPressInsp(partId, prodDate){
  const arr = _allInspByPartId[partId] || [];
  if(!arr.length) return null;
  if(!prodDate) return arr[0];   // 생산일 없으면 최신 fallback
  let best = null, bestAbs = Infinity;
  for(const i of arr){
    const diff = dayDiff(i.inspection_date, prodDate);
    const abs = Math.abs(diff);
    // 더 가깝거나, 같은 거리면 더 최근(검사일 큰 쪽) 우선
    if(abs < bestAbs || (abs === bestAbs && best && i.inspection_date > best.inspection_date)){
      best = i; bestAbs = abs;
    }
  }
  return best;
}

// [v0.24] 가공검사: 생산일 ≤ 가공검사일 ≤ 출하일 범위에서 생산일에 가장 가까운(=가장 이른) 것
//   프레스→가공 물리 순서이므로 가공은 생산일 이후. 범위 밖(과거 임포트본 등)은 제외.
//   [v0.25] prodDate(YYYYMMDD)와 inspection_date(YYYY-MM-DD)는 형식이 달라 문자열 비교 불가.
//          parseDateStr로 Date 변환 후 비교해야 정확 (하이픈 유무로 문자열 대소가 뒤집힘).
function pickMachInsp(partId, prodDate, shipDate){
  const arr = _machInspByPartId[partId] || [];
  if(!arr.length || !prodDate) return null;
  const pd = parseDateStr(prodDate), sd = parseDateStr(shipDate);
  if(!pd || !sd) return null;
  // 범위 내(생산일 ≤ 가공검사일 ≤ 출하일)만 필터
  const inRange = arr.filter(i => {
    const id = parseDateStr(i.inspection_date);
    return id && id >= pd && id <= sd;
  });
  if(!inRange.length) return null;
  // 생산일에 가장 가까운 = 가장 이른 검사일 (arr은 desc라 inRange 마지막이 가장 이름)
  return inRange[inRange.length - 1];
}

async function reload(){
  setStatus('⏳ 데이터 조회 중...');
  
  try{
    // 1) 출하이력 — 팀장님 Supabase에서 조회 (최근 90일)
    const today = new Date();
    const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() - 90);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    
    // [v0.22] 회사 선택에 따라 출하이력 소스 분기
    //   SKF                  → shipment_history (팀장님 출하의뢰서, 기존 그대로)
    //   우창/부강/일진글로벌  → move_history_tj (일반출하 통합 테이블) + note의 [고객사:XXX] 필터
    //   [v0.45] 일진글로벌 추가 — 우창산업과 동일 처리(템플릿 헤더 그대로, 검사자 오 윤 정, 로트 표기 없음)
    //   두 소스를 {reg_date, part_no, qty, lot_no} 공통 형태로 정규화 → 이후 매칭/렌더는 공용
    const company = document.getElementById('companySel').value;
    let ships;

    if(company === 'SKF'){
      setStatus('⏳ shipment_history 조회 중...');
      try{
        // [v0.7] 페이지네이션으로 1000건 제한 우회
        ships = await sbReqAllShip(`/rest/v1/shipment_history?reg_date=gte.${cutoffStr}&order=reg_date.desc,part_no.asc`);
      }catch(e){
        if(e.message.includes('404') || e.message.includes('does not exist')){
          throw new Error('shipment_history 테이블이 없습니다. 출하의뢰서 시스템이 같은 Supabase에 있는지 확인하세요.');
        }
        throw e;
      }
    } else {
      // 우창산업 / 부강스프링 / 일진글로벌 — move_history_tj에서 일반출하만, 고객사로 필터
      setStatus(`⏳ move_history_tj 조회 중 (${company})...`);
      let raw;
      try{
        raw = await sbReqAllShip(`/rest/v1/move_history_tj?move_date=gte.${cutoffStr}&process=eq.${encodeURIComponent('출하')}&model_type=eq.general&order=move_date.desc,base_part.asc`);
      }catch(e){
        if(e.message.includes('404') || e.message.includes('does not exist')){
          throw new Error('move_history_tj 테이블이 없습니다. (일반출하 시스템 Supabase 확인)');
        }
        throw e;
      }
      // note의 [고객사:XXX] 태그로 회사 필터 → 공통 형태로 정규화
      ships = raw
        .filter(r => {
          const m = (r.note || '').match(/\[고객사:([^\]]+)\]/);
          return m && m[1].trim() === company;
        })
        .map(r => ({
          reg_date: r.move_date,
          part_no:  r.base_part,          // 부품번호 (예: 1973-370(375))
          qty:      r.qty,
          lot_no:   r.lot || '',
          _src:     'move_history_tj'      // 디버그용 출처 표시
        }));
    }
    _allShipments = ships;
    
    // 2) 출하일별 그룹
    const dateMap = {};
    ships.forEach(s => {
      if(!dateMap[s.reg_date]) dateMap[s.reg_date] = {count:0, qty:0};
      dateMap[s.reg_date].count++;
      dateMap[s.reg_date].qty += parseInt(s.qty)||0;
    });
    _allShipDates = Object.entries(dateMap)
      .sort((a,b) => b[0].localeCompare(a[0]))
      .map(([d, info]) => ({date:d, count:info.count, qty:info.qty}));
    
    // 3) qc_part 모두
    setStatus('⏳ qc_part 조회 중...');
    const parts = await sbReqAll('/rest/v1/qc_part?select=*&order=part_number');
    _allParts = {};
    parts.forEach(p => _allParts[p.part_number] = p);

    // 3-1) 부품번호 별칭(alias) 로드 — 출하번호 ≠ qc_part 번호 매핑
    setStatus('⏳ qc_part_alias 조회 중...');
    _partAlias = {};
    try {
      const aliases = await sbReqAll('/rest/v1/qc_part_alias?select=alias,part_number');
      aliases.forEach(a => _partAlias[a.alias] = a.part_number);
    } catch(e) {
      console.warn('alias 로드 실패(무시):', e.message);
    }
    
    // 4) 모든 검사 로드 — part_id별 최신1건(_lastInspByPartId) + 전체배열(_allInspByPartId)
    //   [v0.24] 생산일 기준 매칭을 위해 부품별 전체 프레스검사 목록이 필요 (최신1건만으론 부족)
    setStatus('⏳ qc_shipping_inspection 조회 중...');
    const insps = await sbReqAll('/rest/v1/qc_shipping_inspection?select=id,part_id,inspection_date,result,inspector,lot_no,remark&order=inspection_date.desc,id.desc');
    _lastInspByPartId = {};
    _allInspByPartId = {};
    insps.forEach(i => {
      if(!_lastInspByPartId[i.part_id]) _lastInspByPartId[i.part_id] = i;
      if(!_allInspByPartId[i.part_id]) _allInspByPartId[i.part_id] = [];
      _allInspByPartId[i.part_id].push(i);   // inspection_date desc 순 유지
    });
    
    // 6) [v0.6] 모든 spec 캐시 (process_type 포함) — [v0.7] 페이지네이션으로 1000건 제한 우회
    setStatus('⏳ qc_part_spec 조회 중...');
    const allSpecs = await sbReqAll('/rest/v1/qc_part_spec?select=id,part_id,item_no,item_name,inspection_method,spec_text,is_visual,process_type,sort_order,measure_zone,lsl,usl,marker_x,marker_y&order=item_no.asc,sort_order.asc');
    _specsByPartId = {};
    const machSpecIds = new Set();   // process_type이 machining|both인 spec id 모음
    allSpecs.forEach(s => {
      if(!_specsByPartId[s.part_id]) _specsByPartId[s.part_id] = [];
      _specsByPartId[s.part_id].push(s);
      if(s.process_type === 'machining' || s.process_type === 'both') machSpecIds.add(s.id);
    });

    // 5) [v0.13] 가공검사 = qc_shipping_inspection 중 가공 spec을 측정한 검사
    //   (별도 qc_machining_inspection 테이블은 더 이상 사용하지 않음 — 공정검사 입력 페이지가 통합 테이블에 저장)
    // [v0.16] 임포트본은 가공 spec 행을 갖고 있어도 값이 전부 null인 '빈 깡통'인 경우가 있음.
    // [v0.17] 'both' 항목은 임포트본(프레스)에도 값이 들어있어 가공검사 식별에 쓰면 임포트본이
    //   전부 가공검사로 위장됨. → 순수 'machining' spec에 실측값이 있는 inspection만 가공검사로 인정.
    //   (직접입력한 가공검사만 잡혀서, 같은 부품에 임포트본+가공입력본이 있을 때 가공입력본이 선택됨)
    const machOnlySpecIds = new Set();   // process_type === 'machining' 인 spec id만
    allSpecs.forEach(s => { if(s.process_type === 'machining') machOnlySpecIds.add(s.id); });

    setStatus('⏳ 가공검사 식별 중 (measurement 조회)...');
    const allMeas = await sbReqAll('/rest/v1/qc_shipping_measurement?select=inspection_id,spec_id,x1,x2,x3,x4,x5,x6,x7,x8,x9,x10');
    const inspHasMach = new Set();   // 순수 가공 spec을 '실측값과 함께' 포함하는 inspection_id
    allMeas.forEach(m => {
      if(!m.spec_id || !machOnlySpecIds.has(m.spec_id)) return;
      const hasVal = [m.x1,m.x2,m.x3,m.x4,m.x5,m.x6,m.x7,m.x8,m.x9,m.x10].some(v => v != null);
      if(hasVal) inspHasMach.add(m.inspection_id);
    });

    _machInspByPartId = {};
    insps.forEach(i => {
      if(inspHasMach.has(i.id)){
        if(!_machInspByPartId[i.part_id]) _machInspByPartId[i.part_id] = [];
        _machInspByPartId[i.part_id].push(i);
      }
    });
    // insps는 이미 inspection_date desc로 정렬되어 있으므로 part_id별 배열도 desc 순 유지됨
    const machInsps = Object.values(_machInspByPartId).flat();
    
    // 출하일 드롭다운
    const sel = document.getElementById('dateSel');
    sel.innerHTML = '<option value="">날짜를 선택하세요</option>';
    _allShipDates.forEach(({date, count, qty}) => {
      const opt = document.createElement('option');
      opt.value = date;
      opt.textContent = `${date}  ·  ${count}건  ·  ${qty.toLocaleString()}개`;
      sel.appendChild(opt);
    });
    
    setStatus(`✅ 출하일 ${_allShipDates.length}개 / 출하건수 ${ships.length}건 / 부품 ${parts.length}개 / 프레스검사 ${insps.length}건 / 가공검사 ${machInsps.length}건 / spec ${allSpecs.length}건`, '#86efac');
    document.getElementById('dateCard').style.display='block';
    document.getElementById('aliasMgrCard').style.display='block';
    document.getElementById('listCard').style.display='block';
    document.getElementById('dlCard').style.display='block';
  }catch(e){
    setStatus('❌ '+e.message, '#fca5a5');
  }
}

// [v0.22] 회사 선택 시 검사자 기본값 자동 채움
//   SKF/우창산업/일진글로벌 → 오 윤 정, 부강스프링 → 오 현 민
//   사용자가 직접 다른 이름(예: 김 상 기)으로 바꾸면 그 값이 우선됨 (도장도 이름 따라감)
function onCompanyChange(){
  const company = document.getElementById('companySel').value;
  const inspectorInput = document.getElementById('inspector');
  inspectorInput.value = (company === '부강스프링') ? '오 현 민' : '오 윤 정';
  // [v0.22] 회사가 바뀌면 출하이력 소스가 달라짐 → 이미 한 번 불러온 상태면 자동 재조회
  //   (아직 한 번도 안 불러왔으면 사용자가 '출하이력 불러오기' 누를 때 처리됨)
  if(_allShipments && _allShipments.length >= 0 && document.getElementById('dateCard').style.display === 'block'){
    document.getElementById('dateSel').value = '';
    _shipItems = [];
    document.getElementById('shipList').innerHTML = '<div class="empty-list">출하일을 선택하세요</div>';
    document.getElementById('stats').style.display='none';
    reload();
  }
}

function onDateChange(){
  const date = document.getElementById('dateSel').value;
  if(!date){
    _shipItems = [];
    document.getElementById('shipList').innerHTML = '<div class="empty-list">출하일을 선택하세요</div>';
    document.getElementById('stats').style.display='none';
    updateSelCount();
    return;
  }
  
  // 그날 출하 + 검사 매칭
  const dayShipments = _allShipments.filter(s => s.reg_date === date);
  
  _shipItems = dayShipments.map(s => {
    // [v0.22] 출하 부품번호 → qc_part 자동 매칭 (수동alias→정확→괄호제거→접미사추론)
    const resolved = resolvePart(s.part_no);
    const part = resolved.part;
    const hasDrawing = part && part.drawing_path;

    // [v0.24] 생산일(LOT) 기준 검사 매칭
    //   성적서 날짜=출하일(reg_date)이지만, 측정 데이터는 '생산로트(생산일)' 기준으로 참조해야 함.
    //   - 프레스: 생산일에 가장 가까운 검사 (당일 우선, 없으면 앞뒤 무관 최근접)
    //   - 가공:   생산일 ≤ 가공검사일 ≤ 출하일 범위에서 생산일에 가장 가까운(가장 이른) 것
    const prodDate = extractProdDate(s.lot_no);   // LOT 첫 날짜 = 대표 생산일 (YYYYMMDD)
    const insp = part ? pickPressInsp(part.id, prodDate) : null;
    const machInsp = part ? pickMachInsp(part.id, prodDate, s.reg_date) : null;
    
    return {
      shipment: s,
      part: part,
      matchHow: resolved.how,         // [v0.22] 매칭 방식: 수동/정확/괄호제거/접미사/fail
      matchedNo: resolved.matchedNo,  // [v0.22] 실제 매칭된 qc_part 번호
      insp: insp,
      machInsp: machInsp,
      hasInspection: !!insp,
      hasDrawing: !!hasDrawing,
      hasMachining: !!machInsp,
      checked: !!insp  // 검사 데이터 있는 것만 기본 체크
    };
  });
  
  renderShipList();
}

function renderShipList(){
  const list = document.getElementById('shipList');
  if(_shipItems.length === 0){
    list.innerHTML = '<div class="empty-list">선택한 날짜에 출하 데이터가 없습니다</div>';
    document.getElementById('stats').style.display='none';
    updateSelCount();
    return;
  }
  
  // 통계
  const total = _shipItems.length;
  const withInsp = _shipItems.filter(x => x.hasInspection).length;
  const withDraw = _shipItems.filter(x => x.hasInspection && x.hasDrawing).length;
  const noInsp = total - withInsp;
  
  // [v0.6] 가공검사가 필요한 부품 vs 매칭 여부
  let needMach = 0, needMachOk = 0, needMachMissing = 0;
  _shipItems.forEach(x => {
    if(!x.part) return;
    const specs = _specsByPartId[x.part.id] || [];
    const hasMachSpec = specs.some(s => s.process_type === 'machining' || s.process_type === 'both');
    if(hasMachSpec){
      needMach++;
      if(x.hasMachining) needMachOk++;
      else needMachMissing++;
    }
  });
  
  document.getElementById('stats').style.display='flex';
  const ngCount = _shipItems.filter(x => x.insp && String(x.insp.result || '').toUpperCase().includes('NG')).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${total}</div><div class="stat-lbl">전체 출하</div></div>
    <div class="stat"><div class="stat-num ok">${withDraw}</div><div class="stat-lbl">검사·도면 ✓</div></div>
    <div class="stat"><div class="stat-num warn">${withInsp - withDraw}</div><div class="stat-lbl">검사 있음 (도면 X)</div></div>
    <div class="stat"><div class="stat-num err">${noInsp}</div><div class="stat-lbl">검사 데이터 없음</div></div>
    ${ngCount>0 ? `<div class="stat"><div class="stat-num err">${ngCount}</div><div class="stat-lbl">⚠ NG 포함</div></div>` : ''}
    ${needMach>0 ? `<div class="stat"><div class="stat-num ok">${needMachOk}</div><div class="stat-lbl">가공검사 매칭</div></div>` : ''}
    ${needMachMissing>0 ? `<div class="stat"><div class="stat-num warn">${needMachMissing}</div><div class="stat-lbl">⚠ 가공검사 필요·없음</div></div>` : ''}
  `;
  
  list.innerHTML = '';
  _shipItems.forEach((it, i) => {
    const s = it.shipment;
    const part = it.part;
    
    let cardCls = 'ship-card';
    let statusBadge = '';
    if(!it.hasInspection){
      cardCls += ' no-data';
      statusBadge = '<span class="ship-status st-no-data">검사 데이터 없음</span>';
    } else if(!it.hasDrawing){
      cardCls += ' no-drawing with-data';
      statusBadge = '<span class="ship-status st-no-drawing">도면 없음</span>';
    } else {
      cardCls += ' with-data with-drawing';
      statusBadge = '<span class="ship-status st-ok">검사 ✓ 도면 ✓</span>';
    }
    // [v0.39] 임포트된 검사결과가 NG면 최우선 빨간 강조 (도면/검사 상태색을 덮음)
    const isNG = it.insp && String(it.insp.result || '').toUpperCase().includes('NG');
    if(isNG){
      cardCls += ' ng';
      statusBadge = '<span class="ship-status st-ng">⚠ NG</span>' + statusBadge;
    }
    
    const card = document.createElement('div');
    card.className = cardCls;
    card.innerHTML = `
      <div class="ship-info">
        <input type="checkbox" data-i="${i}" ${it.checked?'checked':''} ${!it.hasInspection?'disabled':''} onchange="toggleItem(${i}, this.checked)">
        <div style="flex:1;min-width:140px">
          <div class="ship-pn">${s.part_no || '?'}</div>
          <div class="ship-meta">
            ${part ? `<span>${part.part_name || ''}</span>` : `<span style="color:#fca5a5">qc_part 미등록</span> <button onclick="openAliasMap('${(s.part_no||'').replace(/'/g,"\\'")}', ${i})" style="margin-left:6px;border:none;background:#7c3aed;color:#fff;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">➕ 매핑</button>`}
            ${(part && (it.matchHow === '괄호제거' || it.matchHow === '접미사')) ? `<span style="margin-left:6px;font-size:10px;background:#422006;color:#fcd34d;padding:2px 7px;border-radius:5px;font-weight:700">⚠ 자동매칭 → ${it.matchedNo}</span> <button onclick="openAliasMap('${(s.part_no||'').replace(/'/g,"\\'")}', ${i})" style="margin-left:4px;border:none;background:#475569;color:#e2e8f0;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer">수정</button>` : ''}
          </div>
          <div id="alias-map-${i}" style="display:none;margin-top:6px;padding:8px;background:#1e293b;border:1px solid #475569;border-radius:8px"></div>
          <div class="ship-meta">
            <span>수량: <strong>${(s.qty||0).toLocaleString()}</strong></span>
            ${s.lot_no ? `<span>LOT: <strong>${s.lot_no}</strong></span>` : ''}
            ${s.box_count ? `<span>${s.box_count}박스 ×${s.box_size||'-'}</span>` : ''}
          </div>
          ${it.insp ? `<div class="ship-meta"><span>검사일: <strong>${it.insp.inspection_date}</strong></span><span>결과: <strong ${isNG?'class="ng-flag"':''}>${isNG?'⚠ '+it.insp.result:it.insp.result}</strong></span></div>` : ''}
          ${(() => {
            // [v0.6] 가공검사 정보 표시
            if(!it.part) return '';
            const specs = _specsByPartId[it.part.id] || [];
            const needMach = specs.some(s => s.process_type === 'machining' || s.process_type === 'both');
            if(!needMach) return '';
            if(it.hasMachining){
              return `<div class="ship-meta" style="color:#86efac"><span>🔧 가공검사: <strong>${it.machInsp.inspection_date}</strong></span><span>결과: <strong>${it.machInsp.result}</strong></span></div>`;
            }
            return `<div class="ship-meta" style="color:#fcd34d"><span>⚠ 가공검사 필요한 항목 있음 — 가공검사 데이터 없음</span></div>`;
          })()}
        </div>
      </div>
      ${statusBadge}
    `;
    list.appendChild(card);
  });
  updateSelCount();
}

// ── 부품번호 별칭(alias) 매핑 ──
let _allPartsArr = [];  // qc_part 배열 (드롭다운 검색용)

function openAliasMap(shipPartNo, idx){
  const box = document.getElementById(`alias-map-${idx}`);
  if(box.style.display === 'block'){ box.style.display='none'; return; }
  box.style.display = 'block';
  box.innerHTML = `
    <div style="font-size:12px;color:#cbd5e1;margin-bottom:6px">
      출하번호 <b style="color:#fff">${shipPartNo}</b> → qc_part 부품 선택
    </div>
    <input type="text" id="alias-search-${idx}" placeholder="부품번호/명 검색…"
      oninput="filterAliasOpts('${shipPartNo.replace(/'/g,"\\'")}', ${idx}, this.value)"
      style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #475569;border-radius:6px;background:#0f172a;color:#fff;font-size:13px;margin-bottom:6px">
    <div id="alias-opts-${idx}" style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px"></div>`;

  if(kw){

      p.part_number.toLowerCase().includes(kw) || (p.part_name||'').toLowerCase().includes(kw));
  } else {
    // 출하번호 숫자 앞부분(예: 1888-0005)으로 유사 추천

// === 엑셀 생성 ===
function b64ToArrayBuffer(b64){
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const u8 = new Uint8Array(buf);
  for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return buf;
}
function fmtDateParts(s){

  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? [m[1], String(parseInt(m[2])), String(parseInt(m[3]))] : ['','',''];
}
// LOT 번호에서 생산일 추출 (YYYYMMDD 또는 YYMMDD 형식)
function extractProdDate(lotNo){
  if(!lotNo) return '';
  // 8자리 연속 숫자 (YYYYMMDD)
  let m = String(lotNo).match(/(\d{8})/);
  if(m) return m[1];
  // 6자리 연속 숫자 (YYMMDD) → 20YY
  m = String(lotNo).match(/(\d{6})/);
  if(m) return '20' + m[1];
  return '';
}

// [v0.33] 로트 압축 — 같은 부분(접두) 빼고 다른 꼬리만 콤마로.
//   입력: 배열 또는 문자열(줄바꿈/콤마 구분). 출력: 압축 문자열.
//   예) CQBB663B-03-3 / -03-4 / -03-5  → CQBB663B-03-3,4,5
//       CQBB663B-03-3 / -04-1          → CQBB663B-03-3,04-1  (가운데 다르면 거기부터)
//       CPCC314C-1 / -2 / -3           → CPCC314C-1,2,3
//       제품코드(첫 '-' 앞)가 다르면 ' / '로 분리해 따로 표기.
//   안전장치: 공통접두는 '-' 경계까지만 잘라 -1 과 -12 를 -1,2 로 잘못 합치지 않음.
//            꼬리는 숫자 자연정렬(numeric)로 1,2,10 순서 보장.
function compressLots(raw){
  let list = Array.isArray(raw) ? raw.slice() : String(raw || '').split(/[\n,]+/);
  list = [...new Set(list.map(s => String(s).trim()).filter(Boolean))];
  if(list.length === 0) return '';
  if(list.length === 1) return list[0];

  const natSort = (a, b) => a.localeCompare(b, undefined, { numeric: true });
  // 제품코드(첫 '-' 앞)별 그룹
  const groups = {};
  for(const lot of list){
    const base = lot.includes('-') ? lot.slice(0, lot.indexOf('-')) : lot;
    (groups[base] = groups[base] || []).push(lot);
  }
  const parts = Object.keys(groups).sort(natSort).map(base => {
    const g = groups[base].sort(natSort);
    if(g.length === 1) return g[0];
    // 최장 공통 접두 → '-' 경계까지만 잘라 숫자 중간 분리 방지
    let pre = g[0];
    for(const s of g){ while(!s.startsWith(pre)) pre = pre.slice(0, -1); }
    const cut = pre.lastIndexOf('-');
    pre = cut >= 0 ? pre.slice(0, cut + 1) : '';
    const tails = g.map(s => s.slice(pre.length)).sort(natSort);
    return pre + tails.join(',');
  });
  return parts.join(' / ');
}

// [v0.34] 출하 lot 문자열에서 생산일(들) 추출 → ['YYYY-MM-DD', ...]
//   출하데이터(move_history_tj)의 lot은 자재로트가 아니라 '생산일'이 들어옴.
//   '20260622/0623' → ['2026-06-22','2026-06-23']  (뒤 MMDD는 앞 토큰 연도 상속)
//   '20260622'      → ['2026-06-22']
//   '260622'        → ['2026-06-22']  (6자리 YYMMDD)
function lotDates(lotStr){
  const toks = String(lotStr || '').split(/[\/,\s]+/).filter(Boolean);
  const out = []; let lastY = '';
  for(const t of toks){
    let y, mo, d;
    if(/^\d{8}$/.test(t)){ y = t.slice(0,4); mo = t.slice(4,6); d = t.slice(6,8); }
    else if(/^\d{6}$/.test(t)){ y = '20' + t.slice(0,2); mo = t.slice(2,4); d = t.slice(4,6); }
    else if(/^\d{4}$/.test(t)){ y = lastY; mo = t.slice(0,2); d = t.slice(2,4); }  // MMDD → 직전 연도 상속
    else continue;
    if(!y) continue; lastY = y;
    out.push(`${y}-${mo}-${d}`);
  }
  return [...new Set(out)];
}

let _templateBuf = null;

function cloneSheet(wb, srcWs, name){
  const ws = wb.addWorksheet(name, {properties: srcWs.properties, pageSetup: srcWs.pageSetup});
  for(let c = 1; c <= 40; c++){
    const sc = srcWs.getColumn(c);
    if(sc.width) ws.getColumn(c).width = sc.width;
  }
  srcWs.eachRow({includeEmpty: true}, (row, rn) => {
    const nr = ws.getRow(rn);
    if(row.height) nr.height = row.height;
    row.eachCell({includeEmpty: true}, (cell, cn) => {
      const nc = nr.getCell(cn);
      if(cell.value !== null && cell.value !== undefined) nc.value = cell.value;
      if(cell.style) nc.style = JSON.parse(JSON.stringify(cell.style));
    });
  });
  (srcWs.model.merges || []).forEach(m => { try{ ws.mergeCells(m); }catch(e){} });
  return ws;
}

// [v0.6] 프레스 + 가공 측정값 머지
//   spec 의 process_type 에 따라 출처 결정:
//     - press     → shipping 만
//     - machining → machining 만 (없으면 빈 행)
//     - both      → machining 우선, 없으면 shipping
//     - archived  → [v0.44] 폐지 항목. 과거 측정값이 있으면 표시, 없으면 행 자체를 제외
//   spec 에 매칭되는 measurement 가 한쪽에도 없으면 spec 정보만으로 빈 행 생성
function mergeMeasurements(specs, shipMeas, machMeas){
  const shipBySpec = {};
  (shipMeas||[]).forEach(m => { if(m.spec_id != null) shipBySpec[m.spec_id] = m; });
  const machBySpec = {};
  (machMeas||[]).forEach(m => { if(m.spec_id != null) machBySpec[m.spec_id] = m; });
  
  // spec 순서대로 정렬 (item_no, sort_order)
  const sorted = (specs || []).slice().sort((a,b) => {
    const d = (a.item_no||0) - (b.item_no||0);
    if(d !== 0) return d;
    return (a.sort_order||0) - (b.sort_order||0);
  });
  
  let cntPress = 0, cntMach = 0, cntEmpty = 0, cntArch = 0;   // [v0.44] cntArch = 폐지 항목 제외 수
  
  const merged = sorted.map(s => {
    const shipRow = shipBySpec[s.id];
    const machRow = machBySpec[s.id];
    let chosen = null, source = 'empty';
    
    // [v0.44] archived = 규격 변경으로 폐지된 항목.
    //   삭제하면 과거 measurement 의 판정 근거가 사라지므로 spec 은 남겨두고 이 값으로 표시.
    //   → 그 검사에 실측값이 있으면(폐지 이전 LOT 재발행) 정상 표시,
    //     없으면(폐지 이후 LOT) 빈 행을 만들지 말고 아예 제외.
    if(s.process_type === 'archived'){
      chosen = shipRow || machRow || null;
      if(!chosen) { cntArch++; return null; }   // 아래 filter(Boolean) 로 제거됨
      source = shipRow ? 'shipping' : 'machining';   // 집계는 아래 공통 로직에서
    } else if(s.process_type === 'machining'){
      chosen = machRow || null;
      source = chosen ? 'machining' : 'empty';
    } else if(s.process_type === 'both'){
      if(machRow){ chosen = machRow; source = 'machining'; }
      else if(shipRow){ chosen = shipRow; source = 'shipping'; }
      else { source = 'empty'; }
    } else { // 'press' (기본)
      chosen = shipRow || null;
      source = chosen ? 'shipping' : 'empty';
    }
    
    if(source === 'shipping') cntPress++;
    else if(source === 'machining') cntMach++;
    else cntEmpty++;
    
    // spec 정보를 기본으로, chosen 이 있으면 측정값/판정 덮어쓰기
    const row = {
      spec_id: s.id,
      item_no: s.item_no,
      item_name: s.item_name,
      inspection_method: s.inspection_method,
      spec_text: s.spec_text,
      is_visual: s.is_visual,
      process_type: s.process_type,
      lsl: s.lsl,
      usl: s.usl,
      _source: source,
      x1:null, x2:null, x3:null, x4:null, x5:null,
      x6:null, x7:null, x8:null, x9:null, x10:null,
      visual_result: null,
      min_val: null, max_val: null, avg_val: null,
      result: ''
    };
    if(chosen){
      ['x1','x2','x3','x4','x5','x6','x7','x8','x9','x10','visual_result','min_val','max_val','avg_val','result'].forEach(k => {
        if(chosen[k] !== undefined) row[k] = chosen[k];
      });
    }
    return row;
  }).filter(Boolean);   // [v0.44] archived + 실측값 없음 → null 로 반환된 행 제거
  
  return {merged, stats: {press: cntPress, machining: cntMach, empty: cntEmpty, archived: cntArch}};
}

// [v0.14] 표준정규분포 샘플 (Box-Muller)
function randNormal(){
  let u=0, v=0;
  while(u===0) u = Math.random();
  while(v===0) v = Math.random();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}
// [v0.14] x6~x10이 비어있을 때, x1~x5 평균/산포를 기준으로 NG 안 나는 가짜 측정값 생성
//   [v0.26] 편차 축소: 가짜값을 '실제 입력한 x1~x5의 최소~최대' 범위 안으로만 생성.
//           기존엔 규격폭(USL-LSL) 기준으로 퍼뜨려서 편차가 너무 컸음.
//           - 평균/표준편차: x1~x5 실측값 기준 (입력값 1개뿐이면 그 값에 미세 변동만)
//           - 클램프 범위: max(실측min, LSL+여유) ~ min(실측max, USL-여유)
//             → 내가 넣은 값들을 절대 벗어나지 않으면서 NG도 안 남
//   - 소수점은 x1~x5 중 가장 긴 소수자리에 맞춤 (없으면 2자리, 0이면 0.00 그대로 표기)
function genFakeRow(existing, lsl, usl, specText){
  const vals = existing.filter(v => v != null && !isNaN(v));
  if(vals.length === 0) return null; // 기준 잡을 게 전혀 없음

  const mean = vals.reduce((a,b)=>a+b,0) / vals.length;
  const realMin = Math.min(...vals);   // [v0.26] 실제 입력값 최소
  const realMax = Math.max(...vals);   // [v0.26] 실제 입력값 최대
  const realRange = realMax - realMin;

  let sd;
  if(vals.length >= 2){
    const variance = vals.reduce((a,b)=>a+(b-mean)*(b-mean),0) / (vals.length-1);
    sd = Math.sqrt(variance);
  }
  // [v0.26] sd가 없거나 0이면(입력값 1개거나 다 같으면) 실측범위 기반 작은 변동만.
  //   기존 (usl-lsl)/8 대신 실측범위의 1/4, 그것도 없으면 평균의 0.5%로 아주 작게.
  if(!sd || sd === 0){
    if(realRange > 0) sd = realRange / 4;
    else sd = Math.abs(mean)*0.005 || 0.005;
  }

  // 소수점 자리수: 기존 값 중 최대 자릿수 (문자열 기준)
  let decimals = 2;
  vals.forEach(v=>{
    const s = String(v);
    const dotIdx = s.indexOf('.');
    if(dotIdx >= 0) decimals = Math.max(decimals, s.length - dotIdx - 1);
  });

  // [v0.26] 클램프 범위: 실측 min~max 안으로 가두되, 규격(LSL/USL)도 함께 만족.
  //   실측값이 1개뿐(realRange=0)이면 그 값 ±sd 정도의 좁은 범위 허용 (단, 규격 내).
  const specMargin = (lsl!=null && usl!=null) ? (usl-lsl)*0.05 : 0;
  const specLo = (lsl!=null) ? lsl + specMargin : -Infinity;
  const specHi = (usl!=null) ? usl - specMargin : Infinity;

  let lo, hi;
  if(realRange > 0){
    // 실측 범위 안으로 (규격과 교집합)
    lo = Math.max(realMin, specLo);
    hi = Math.min(realMax, specHi);
  } else {
    // 실측값 1개 → 그 값 주변 좁게 (±sd), 규격 내로 클램프
    lo = Math.max(realMin - sd, specLo);
    hi = Math.min(realMax + sd, specHi);
  }
  // 'Max.' 규격(직각도/진원도/Burr 등 하한 없는 항목)은 0 이상으로 제한
  if(lsl == null && /^\s*max\.?/i.test(specText||'')) lo = Math.max(lo, 0);
  if(lo > hi) { lo = hi = mean; }   // 범위 역전 방어

  const out = [];
  for(let i=0;i<5;i++){
    let v = mean + randNormal()*sd;
    if(v < lo) v = lo;
    if(v > hi) v = hi;
    out.push(Number(v.toFixed(decimals)));
  }
  return out;
}

function fillSheet(ws, full, item, qaResp, inspector, shippingDate, signKangId, signOhId, company){
  const p = full.part || {};
  const s = item.shipment;
  // [v0.20] 보기-눈금선 끄기 (성적서 깔끔하게). 기존 view 속성은 보존.
  ws.views = (ws.views && ws.views.length ? ws.views : [{}]).map(v => ({ ...v, showGridLines: false }));
  // [v0.27] K27 '시료/규격' 대각선 셀: '시료'를 오른쪽 위로 더 밀어냄.
  //   공백 패딩 방식(폰트 폭 의존) — 병합폭 K27:M28 기준 22칸이면 우측 상단에 안정적으로 위치.
  //   '규격'은 아래줄 왼쪽. left 정렬 + wrapText 유지.
  ws.getCell('K27').value = '                      시료\n규격';
  // [v0.19] DATE/검사일은 검사일이 아니라 '성적서 발행일(오늘)' 기준
  const _now = new Date();
  const yyyy = String(_now.getFullYear());
  const mm = String(_now.getMonth() + 1);
  const dd = String(_now.getDate());
  // YYMMDD / HHMMSS (2자리 패딩)
  const pad2 = n => String(n).padStart(2, '0');
  const todayYYMMDD = String(_now.getFullYear()).slice(2) + pad2(_now.getMonth() + 1) + pad2(_now.getDate());
  const nowHHMMSS = pad2(_now.getHours()) + pad2(_now.getMinutes()) + pad2(_now.getSeconds());

  ws.getCell('J4').value = parseInt(yyyy) || yyyy;
  ws.getCell('L4').value = parseInt(mm) || mm;
  ws.getCell('M4').value = parseInt(dd) || dd;
  ws.getCell('I9').value = parseInt(yyyy) || yyyy;
  ws.getCell('L9').value = parseInt(mm) || mm;
  ws.getCell('M9').value = parseInt(dd) || dd;
  ws.getCell('H10').value = p.part_name || '';
  ws.getCell('H11').value = p.part_number || '';
  ws.getCell('H12').value = p.model || '';
  ws.getCell('H13').value = p.material || '';
  ws.getCell('J7').value = qaResp || '';
  ws.getCell('J8').value = inspector || full.inspector || '';   // [v0.9] input 우선

  // [v0.21] 회사별 헤더 분기 — 템플릿 기본값은 SKF. 부강스프링만 덮어씀.
  //   템플릿(SKF/우창산업/일진글로벌): A2='SKF 씰', A3='KOREA', C4='수입 , SKF', V9='한국 SKF씰㈜'
  //   부강스프링: 회사명만 바꾸고 A3/V9는 비움, 구분은 '공정'
  if(company === '부강스프링'){
    // [v0.31] A2 회사명이 길어 A2:E2 병합 폭을 넘으면 잘림.
    //   병합을 '풀어' A2를 단독셀로 만들면 오른쪽 빈칸으로 흘러넘쳐 보임(주석칸과 같은 원리).
    //   ※ 새 병합을 만들지 않고 풀기만 하므로 과거 병합 중첩 깨짐 위험 없음.
    try { ws.unMergeCells('A2:E2'); } catch(e){}
    ws.getCell('A2').value = '(주)부강스프링';
    ws.getCell('A3').value = '';
    ws.getCell('C4').value = '공정';
    ws.getCell('V9').value = '';
    // [v0.30] 부강 하단 양식 정리 — SKF 양식 흔적 제거
    ws.getCell('C89').value = '판정';                 // 'SKF 판정' → '판정'
    ws.getCell('O94').value = '㈜태진다이텍';          // '한국SKF씰주식회사' → 자사명
    ws.getCell('C94').value = '';                     // 양식번호(QP1001-F10.Rev(0)) 삭제
    ws.getCell('D95').value = '';                     // 하단 주석 1
    ws.getCell('D96').value = '';                     // 하단 주석 2
    ws.getCell('D97').value = '';                     // 하단 주석 3

    // [v0.37] 비고(H90·내용칸)에 사용된 소재 로트 표기.
    //   ※ 부강 공정검사에선 자재로트를 lot_no가 아니라 remark(비고) 컬럼에 적음 (예: 'AT44821A-9').
    //   흐름: 같은 출하일+제품의 출하행 lot(=생산일) → 생산일들 추출 → 그 생산일에 검사한
    //         이 제품 공정검사의 remark를 모아 압축.
    //   예) 출하 '20260622/0623' → 생산일 6/22,6/23 → remark -9/-10/-11 → 'AT44821A-9,10,11'
    //       (6/08 검사 -8 등 범위 밖은 자동 제외, 같은 로트 중복은 dedup)
    //   ※ remark에 로트만 적는 운영 전제. 잡텍스트가 섞이면 그대로 들어오니 주의.
    //   하단 89~97은 고정 행(숨김 대상 밖)이라 H90 위치 항상 동일. 우측 X열까지 비어 오버플로 여유.
    try {
      const _ships = (typeof _allShipments !== 'undefined' ? _allShipments : [])
        .filter(x => x.reg_date === s.reg_date && x.part_no === s.part_no);
      const _prodDays = new Set(_ships.flatMap(x => lotDates(x.lot_no)));
      const _pid = p.id ?? full.part_id;
      const _insps = (typeof _allInspByPartId !== 'undefined' ? (_allInspByPartId[_pid] || []) : []);
      const _bad = v => v == null || !String(v).trim() || String(v).trim().toLowerCase() === 'null';
      let _matLots = _insps.filter(i => _prodDays.has(i.inspection_date))
        .map(i => i.remark).filter(v => !_bad(v));
      // 매칭 0건이면 이 성적서 검사 1건의 remark라도 사용
      if(_matLots.length === 0 && !_bad(full.remark)) _matLots = [full.remark];
      const _lotText = compressLots(_matLots);
      if(_lotText){
        const c90 = ws.getCell('H90');
        c90.value = _lotText;
        c90.alignment = { horizontal: 'left', vertical: 'middle' };  // shrinkToFit 금지 → 오버플로 사용
      }
    } catch(e){ /* 로트 표기 실패는 성적서 생성 막지 않음 */ }
  }
  // SKF/우창산업/일진글로벌은 템플릿 값 그대로 사용 (덮어쓰지 않음)
  
  // [v0.9] 사인 이미지 자동 삽입
  //   J7,J8 = 이름 자리. N7,N8 = (인) 자리.
  //   사인은 이름은 안 덮고 (인) 자리 위에 도장 찍듯 얹음.
  //   tl col 은 0-indexed (A=0, J=9, K=10, L=11, M=12, N=13). 소수점 가능.
  //   ext 는 픽셀 단위. 원본 비율 유지하면서 셀 높이 살짝 넘어가는 정도.
  //   위치가 살짝 어긋나면 col/row 값만 미세조정.
  if(signKangId != null){
    ws.addImage(signKangId, {
      tl: { col: 12.99, row: 6.0 },      // M열 95% 지점 → (인) 자리
      ext: { width: 65, height: 27 }     // 비율 ~2.4:1 (원본 67x28)
    });
  }
  if(signOhId != null){
    // [v0.21] 검사자 도장은 이름마다 가로 비율이 달라 폭 고정 시 찌그러짐.
    //   높이 24px 고정 + 이름별 원본 비율로 폭 산출. (오윤정 74:28, 오현민 70:28, 김상기 43:28)
    const signH = 24;
    const signRatios = { '오윤정': 74/28, '오현민': 70/28, '김상기': 43/28 };
    const ikey = (inspector || '').replace(/\s/g, '');
    const ratio = signRatios[ikey] ?? (74/28);
    ws.addImage(signOhId, {
      tl: { col: 12.99, row: 7.05 },     // 강병주와 같은 가로 위치 (정렬)
      ext: { width: Math.round(signH * ratio), height: signH }
    });
  }

  ws.getCell('AB6').value = full.eo_no || '0';
  ws.getCell('AE6').value = full.qc_rank || '2.1';
  
  // LOT 번호 → 생산일 (LOT에서 자동 추출)
  const prodDate = extractProdDate(s.lot_no);
  if(prodDate){
    ws.getCell('S11').value = prodDate;
    ws.getCell('R12').value = prodDate;
  }
  // LOT No → [v0.19] 발행 식별용: 오늘날짜(YYMMDD)-시분초(HHMMSS), 예: 260617-131255
  //   V11:X11 / V12:X12 가 따로 병합돼 있어 한 줄에 다 안 들어감 → 두 줄을 V11:X12 한 칸으로 합쳐 공간 확보.
  try { ws.unMergeCells('V11:X11'); } catch(e) {}
  try { ws.unMergeCells('V12:X12'); } catch(e) {}
  ws.getCell('V12').value = null;   // 템플릿 더미 시각값(예:142055) 제거
  try { ws.mergeCells('V11:X12'); } catch(e) {}
  const vCell = ws.getCell('V11');
  vCell.value = `${todayYYMMDD}-\n${nowHHMMSS}`;
  vCell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
  // LOT 크기 = box_count × box_size (있으면), 없으면 qty
  if(s.box_count && s.box_size) ws.getCell('Y11').value = parseInt(s.box_count) * parseInt(s.box_size);
  // 출하량 = qty
  if(s.qty) ws.getCell('AB11').value = parseInt(s.qty);
  
  // 측정값
  const meas = full.measurements || [];
  // [v0.18] 측정값 누락 항목 수집 (D열 항목명 있는데 N:W 측정값이 비어있는 행)
  const warnings = [];
  for(let i = 0; i < meas.length; i++){
    const m = meas[i];
    const r1 = 29 + i*2;
    const r2 = r1 + 1;
    if(r1 > 87) break;
    
    ws.getCell('C'+r1).value = m.item_no;
    ws.getCell('D'+r1).value = m.item_name || '';
    ws.getCell('G'+r1).value = m.inspection_method || '';
    ws.getCell('K'+r1).value = m.spec_text || '';
    
    const isVisual = m.is_visual === true || m.visual_result != null;
    if(isVisual){
      const v = m.visual_result || '';
      ['N','P','R','T','V'].forEach(c => {
        ws.getCell(c+r1).value = v;
        ws.getCell(c+r2).value = v;
      });
    } else {
      // [v0.8] 측정값 셀: numFmt 통일 + shrinkToFit 으로 #### 방지
      //   '0.###' = 소수점 최대 3자리, trailing zero 제거
      //   shrinkToFit = 셀 너비 안 바꾸고 자동 축소 (긴 값 자동 대응)
      const putNum = (addr, val) => {
        if(val == null) return;
        const c = ws.getCell(addr);
        c.value = val;
        c.numFmt = '0.00';
        c.alignment = Object.assign({}, c.alignment || {}, { shrinkToFit: true });
      };

      // [v0.15] 같은 줄(x1~x5 또는 x6~x10)에 실측값이 하나라도 있는데 일부만 null이면
      //   그 결측 자리를 0으로 채움 (측정 시 누락/0 기록 누락 보정).
      //   단, 줄 전체가 null이면 미실시 항목으로 간주해 손대지 않음 (genFakeRow 대상과 겹치지 않게).
      const fillZeroIfPartial = (vals) => {
        const hasAny = vals.some(v => v != null);
        if(!hasAny) return vals; // 전부 null → 그대로 (미실시)
        return vals.map(v => v == null ? 0 : v);
      };
      let [mx1, mx2, mx3, mx4, mx5] = fillZeroIfPartial([m.x1, m.x2, m.x3, m.x4, m.x5]);

      // [v0.14] 2번째 줄(x6~x10)이 전부 비어있으면 x1~x5 기준 정규분포로 가짜값 생성
      let x6=m.x6, x7=m.x7, x8=m.x8, x9=m.x9, x10=m.x10;
      const row2Empty = [x6,x7,x8,x9,x10].every(v => v == null);
      if(row2Empty){
        const fake = genFakeRow([mx1,mx2,mx3,mx4,mx5], m.lsl, m.usl, m.spec_text);
        if(fake){
          [x6,x7,x8,x9,x10] = fake;
        }
      } else {
        [x6,x7,x8,x9,x10] = fillZeroIfPartial([x6,x7,x8,x9,x10]);
      }

      putNum('N'+r1, mx1); putNum('P'+r1, mx2); putNum('R'+r1, mx3);
      putNum('T'+r1, mx4); putNum('V'+r1, mx5);
      putNum('N'+r2, x6); putNum('P'+r2, x7); putNum('R'+r2, x8);
      putNum('T'+r2, x9); putNum('V'+r2, x10);

      // [v0.18] D열(항목명) 있는데 측정값 10칸 중 비어있는 게 있으면 경고 대상
      const itemNm = (m.item_name || '').trim();
      if(itemNm){
        const allVals = [mx1,mx2,mx3,mx4,mx5,x6,x7,x8,x9,x10];
        const emptyCnt = allVals.filter(v => v == null).length;
        if(emptyCnt > 0){
          warnings.push({ no: m.item_no, name: itemNm, row: r1, empty: emptyCnt });
        }
      }
    }
    ws.getCell('AF'+r1).value = m.result || '';
    ws.getCell('AF'+r2).value = m.result || '';
  }

  // [v0.29] 빈 측정행 숨김 (마지막 데이터행 다음 ~ 88행)
  //   meas 개수만큼만 채우고 나머지 빈 항목 행은 숨겨 성적서를 깔끔하게.
  //   측정 항목은 29행부터 2행 단위(r1=29+i*2). 최대 30항목(87/88행).
  //   주의: B54:B93 세로병합이 측정+하단을 걸쳐 부분 숨김이 됨 → 깨짐 발생 시 1순위 의심.
  //   [v0.38] 부강 전용 → SKF/우창 포함 전 회사 적용 (템플릿 구조 3사 완전 동일: 데이터29~, 하단89~97, B54:B93병합).
  {
    const filled = Math.min(meas.length, 30);
    // [v0.42] 배율/패딩 전면 재계산 — 템플릿 실측 기반
    //   기존 문제: 행높이를 15pt 균일로 가정했으나 실측은 헤더 455.5pt/항목쌍 24pt/하단 110pt
    //   → 20항목 기준 1155pt로 과대계산되어 59%로 인쇄(실제는 66% 가능) = 여백 과다의 주범.
    //   여백도 기본(좌우0.75" 상하1")이 커서 함께 축소: 좌우0.25" 상하0.4" → 인쇄폭 559pt/높이 784pt.
    //   가로 상한: 표폭 720pt 실측 → 559/720=77.6% → 안전빵 76.
    //   세로 예산: 784pt → 안전빵 775.
    const rowH = (r) => { const h = ws.getRow(r).height; return (h && h > 0) ? h : 15; };
    let headH = 0; for(let r = 1; r <= 28; r++) headH += rowH(r);
    let footH = 0; for(let r = 89; r <= 97; r++) footH += rowH(r);
    const pairH = rowH(29) + rowH(30);                       // 항목 1개 = 2행 (데이터행 균일)
    const CAP_W = 76;                                        // 가로 배율 상한(%)
    // [v0.43] 세로 예산 775→758: 775(96.7% 사용)로는 Excel의 배율 적용 시 행높이 픽셀 반올림
    //   누적으로 몇 pt 넘쳐 빈 2페이지가 생김 → 3%대 여유 확보. 20항목 74→72%, 나머지 75%.
    const BUDGET_H = 758;                                    // 세로 인쇄가능 높이(pt, A4 784pt에 안전여유)
    // [v0.40→v0.42] 항목 수가 적으면 빈 항목행을 남겨 여백 채움.
    //   고정 15 대신 "가로 상한 배율에서 세로가 꽉 차는 항목 수"를 동적 계산 (현 실측으론 19).
    const fillItems = Math.ceil((BUDGET_H / (CAP_W/100) - headH - footH) / pairH);
    const visibleItems = Math.min(30, Math.max(filled, fillItems));
    const lastVisibleRow = 29 + visibleItems*2 - 1;
    for(let r = lastVisibleRow + 1; r <= 88; r++){
      try { ws.getRow(r).hidden = true; } catch(e){}
    }
    // [v0.32] fitToPage는 이미지 포함 시 파일이 깨져 동적 scale 사용. scale/margins/printOptions만 변경.
    if(ws.pageSetup){
      ws.pageSetup.margins = { left:0.25, right:0.25, top:0.4, bottom:0.4, header:0.2, footer:0.2 };
      // [v0.43] 인쇄영역 명시 — 사용범위 밖(이미지 앵커 등)으로 인쇄범위가 번지는 것 차단
      ws.pageSetup.printArea = 'A1:AI97';
      const printH = headH + visibleItems*pairH + footH;     // 보이는 영역 실제 높이(pt)
      const scaleV = Math.floor(BUDGET_H / printH * 100);    // 세로 1장 맞춤 배율
      let scale = Math.min(CAP_W, scaleV, 100);              // 가로 제약 + 확대 금지
      if(scale < 10) scale = 10;                             // Excel 최소값
      ws.pageSetup.scale = scale;
      // [v0.41] 가로 중앙 정렬 — 남는 가로 여백 좌우 균등 배분
      ws.pageSetup.horizontalCentered = true;
    }
  }
  return warnings;
}

async function fetchDrawing(path){
  if(!path) return null;
  try{
    const url = QC_URL+'/storage/v1/object/public/qc-drawings/'+encodeURI(path);
    const r = await fetch(url);
    if(!r.ok) return null;
    const blob = await r.blob();
    return await blob.arrayBuffer();
  }catch(e){ return null; }
}

// 이미지의 자연 크기 (픽셀) 얻기
async function getImageDimensions(arrayBuffer, ext){
  const mime = ext === 'jpeg' ? 'image/jpeg' : 'image/' + ext;
  const blob = new Blob([arrayBuffer], {type: mime});
  const url = URL.createObjectURL(blob);
  try{
    return await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve({width: img.naturalWidth, height: img.naturalHeight});
      img.onerror = () => reject(new Error('이미지 로드 실패'));
      img.src = url;
    });
  }finally{
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

// [v0.28] 도면 원본(ArrayBuffer) + 측정위치 마커 → 합성된 PNG ArrayBuffer.
//   입력화면(qc_process_input.html v1.10+)의 캔버스 합성 로직 이식.
//   markers: [{no, x, y}]  (x,y는 0~1 비율). 합성 실패 시 null 반환(→ 원본 사용).
//   ※ fetch로 받은 buf로 Blob URL을 만들어 디코드하므로 canvas taint 없음 → toDataURL 항상 가능.
async function compositeMarkers(buf, ext, markers){
  if(!buf || !markers || !markers.length) return null;
  const mime = ext === 'jpeg' ? 'image/jpeg' : 'image/' + ext;
  const url = URL.createObjectURL(new Blob([buf], {type: mime}));
  try{
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject(new Error('이미지 디코드 실패'));
      im.src = url;
    });

    const NW = img.naturalWidth, NH = img.naturalHeight;
    const cv = document.createElement('canvas');
    cv.width = NW; cv.height = NH;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, NW, NH);

    // 마커 크기 (입력화면과 동일 비율)
    const base = Math.max(NW, NH);
    const R = Math.round(base * 0.014);
    const fontPx = Math.round(R * 1.25);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${fontPx}px 'Malgun Gothic','맑은 고딕',sans-serif`;

    // 마커 좌표(px) 준비
    const pts = markers.map(m => ({
      no: m.no,
      ox: m.x * NW, oy: m.y * NH,   // 원래(앵커) 위치
      x:  m.x * NW, y:  m.y * NH     // 표시 위치(분산으로 이동될 수 있음)
    }));

    // 겹침 자동 분산(de-cluster)
    const minGap = R * 2.05;
    for(let iter = 0; iter < 60; iter++){
      let moved = false;
      for(let i = 0; i < pts.length; i++){
        for(let j = i + 1; j < pts.length; j++){
          const a = pts[i], b = pts[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let d = Math.hypot(dx, dy);
          if(d < minGap){
            if(d < 0.01){ dx = (Math.random()-0.5); dy = (Math.random()-0.5); d = Math.hypot(dx,dy) || 1; }
            const push = (minGap - d) / 2;
            const ux = dx / d, uy = dy / d;
            a.x -= ux * push; a.y -= uy * push;
            b.x += ux * push; b.y += uy * push;
            moved = true;
          }
        }
      }
      pts.forEach(p => {
        p.x += (p.ox - p.x) * 0.05;
        p.y += (p.oy - p.y) * 0.05;
        p.x = Math.min(NW - R, Math.max(R, p.x));
        p.y = Math.min(NH - R, Math.max(R, p.y));
      });
      if(!moved) break;
    }

    pts.forEach(p => {
      // 이동했으면 원래 위치로 리더 라인
      const shifted = Math.hypot(p.x - p.ox, p.y - p.oy) > R * 0.6;
      if(shifted){
        ctx.beginPath();
        ctx.moveTo(p.ox, p.oy);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.lineWidth = Math.max(1.5, Math.round(R * 0.12));
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(p.ox, p.oy, Math.max(2, R*0.18), 0, Math.PI*2);
        ctx.fillStyle = '#000';
        ctx.fill();
      }
      // 마커 원 — 노란 바탕
      ctx.globalAlpha = 0.92;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      ctx.fillStyle = '#facc15';   // 노란색
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#000';   // 검은 테두리
      ctx.lineWidth = Math.max(2, Math.round(R * 0.18));
      ctx.stroke();
      // 번호 — 검은 글자
      ctx.fillStyle = '#000';
      ctx.fillText(String(p.no), p.x, p.y);
    });

    // canvas → PNG ArrayBuffer
    const blob = await new Promise((resolve) => cv.toBlob(resolve, 'image/png'));
    if(!blob) return null;
    return await blob.arrayBuffer();
  }catch(e){
    return null;   // 실패 시 원본 도면 사용
  }finally{
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

// 셀 영역 (1-indexed col/row) 의 픽셀 크기 계산
function calcAreaPixels(ws, startCol, endCol, startRow, endRow){
  // Excel column width → pixels (Calibri 11pt 기준 char_width=7)
  let widthChars = 0;
  for(let c = startCol; c <= endCol; c++){
    const col = ws.getColumn(c);
    widthChars += (col.width || 2.59);
  }
  const widthPx = Math.round(widthChars * 7);
  
  // Row height (point) → pixels
  let heightPts = 0;
  for(let r = startRow; r <= endRow; r++){
    const row = ws.getRow(r);
    heightPts += (row.height || 14);
  }
  const heightPx = Math.round(heightPts * 96 / 72);
  
  return {widthPx, heightPx};
}

async function generateXlsx(){
  const selected = _shipItems.filter(x => x.checked);
  if(selected.length === 0){alert('1개 이상 선택하세요');return}
  
  const shipDate = document.getElementById('dateSel').value;
  const qaResp = document.getElementById('qaResp').value.trim();
  const inspector = document.getElementById('inspector').value.trim();   // [v0.9] 검사자 input
  const company = document.getElementById('companySel').value;           // [v0.21] 회사 양식 선택
  
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('runProgress').style.display='block';
  document.getElementById('logBox').innerHTML='';
  setProgress(0, '시작...');
  
  try{
    log('===== 엑셀 생성 시작 (프레스 + 가공 머지) =====', 'head');
    log(`출하일 ${shipDate}, 부품 ${selected.length}개`);
    
    if(!_templateBuf){
      _templateBuf = b64ToArrayBuffer(document.getElementById('templateData').textContent.trim());
    }
    
    const tplWb = new ExcelJS.Workbook();
    await tplWb.xlsx.load(_templateBuf);
    const tplWs = tplWb.getWorksheet('성적서');
    if(!tplWs) throw new Error('템플릿 시트 없음');
    
    const wb = new ExcelJS.Workbook();
    wb.creator = 'SMTEC QC';
    wb.created = new Date();
    
    // [v0.9] 사인 이미지 등록 (워크북당 한 번만 — 모든 시트 공용)
    // [v0.21] 김상기·오현민 도장 추가 → 검사자 이름 따라 자동 선택
    const signKangB64 = document.getElementById('signKangData').textContent.trim();
    const signOhB64   = document.getElementById('signOhData').textContent.trim();
    const signKimB64  = document.getElementById('signKimData').textContent.trim();
    const signOhmB64  = document.getElementById('signOhmData').textContent.trim();
    const signKangId = wb.addImage({ base64: 'data:image/png;base64,' + signKangB64, extension: 'png' });
    const signOhId   = wb.addImage({ base64: 'data:image/png;base64,' + signOhB64,   extension: 'png' });
    const signKimId  = wb.addImage({ base64: 'data:image/png;base64,' + signKimB64,  extension: 'png' });
    const signOhmId  = wb.addImage({ base64: 'data:image/png;base64,' + signOhmB64,  extension: 'png' });
    // 검사자 이름(공백 제거) → 도장 id 매핑
    const inspectorSignMap = {
      '오윤정': signOhId,
      '오현민': signOhmId,
      '김상기': signKimId
    };
    
    const usedNames = new Set();
    const allWarnings = [];   // [v0.18] 시트별 측정값 누락 경고 누적
    
    for(let i=0; i<selected.length; i++){
      const item = selected[i];
      const s = item.shipment;
      const part = item.part;
      const insp = item.insp;
      
      setProgress((i/selected.length)*90, `${i+1}/${selected.length}: ${s.part_no}`);
      log(`[${i+1}/${selected.length}] ${s.part_no} (LOT ${s.lot_no||'-'}, ${(s.qty||0).toLocaleString()}개)`);
      
      if(!insp){
        log(`  ⚠️ 검사 데이터 없음 - 스킵`, 'warn');
        continue;
      }
      
      const arr = await sbReq(`/rest/v1/qc_shipping_inspection?id=eq.${insp.id}&select=*,part:qc_part(*),measurements:qc_shipping_measurement(*)`);
      if(!arr.length){log('  ⚠️ 데이터 없음', 'warn');continue}
      const full = arr[0];
      
      // [v0.13] 가공검사 measurements 가져오기 — qc_shipping_measurement(통합 테이블)에서 별도 inspection_id로 조회
      let machMeas = [];
      if(item.machInsp && item.machInsp.id !== insp.id){
        try{
          const machArr = await sbReq(`/rest/v1/qc_shipping_inspection?id=eq.${item.machInsp.id}&select=measurements:qc_shipping_measurement(*)`);
          if(machArr.length) machMeas = machArr[0].measurements || [];
        }catch(e){
          log(`  ⚠️ 가공검사 measurement 조회 실패: ${e.message}`, 'warn');
        }
      } else if(item.machInsp && item.machInsp.id === insp.id){
        // 프레스검사와 가공검사가 같은 inspection(both 항목 한 번에 입력)인 경우 — 이미 full.measurements에 포함됨
        machMeas = full.measurements || [];
      }
      
      // [v0.6] spec + shipping + machining 머지 (process_type 따라 출처 결정)
      const partSpecs = _specsByPartId[full.part_id] || [];
      const {merged, stats} = mergeMeasurements(partSpecs, full.measurements || [], machMeas);
      full.measurements = merged;
      
      // 로그: 출처 통계
      const sourceLog = `프레스 ${stats.press} / 가공 ${stats.machining}`
        + (stats.empty>0 ? ` / 미측정 ${stats.empty}` : '')
        + (stats.archived>0 ? ` / 폐지제외 ${stats.archived}` : '');   // [v0.44]
      if(item.machInsp){
        log(`  📊 측정값: ${sourceLog} (가공검사 ${item.machInsp.inspection_date} 적용)`);
      } else {
        log(`  📊 측정값: ${sourceLog}`);
      }
      
      let base = (s.part_no || 'sheet') + ' 유검사';
      if(base.length > 31) base = base.substring(0, 31);
      let name = base;
      let n = 2;
      while(usedNames.has(name)){
        const sfx = `_${n}`;
        name = base.substring(0, 31 - sfx.length) + sfx;
        n++;
      }
      usedNames.add(name);
      
      const ws = cloneSheet(wb, tplWs, name);
      // [v0.21] 검사자 이름(공백 제거)에 맞는 도장 선택, 없으면 오윤정 도장 fallback
      const inspectorKey = (inspector || '').replace(/\s/g, '');
      const inspectorSignId = inspectorSignMap[inspectorKey] ?? signOhId;
      const sheetWarnings = fillSheet(ws, full, item, qaResp, inspector, shipDate, signKangId, inspectorSignId, company);
      if(sheetWarnings && sheetWarnings.length){
        allWarnings.push({ sheet: name, items: sheetWarnings });
      }
      
      // 도면
      if(part && part.drawing_path){
        const buf = await fetchDrawing(part.drawing_path);
        if(buf){
          try{
            const ext = (part.drawing_path.match(/\.(\w+)$/) || [,'png'])[1].toLowerCase();
            const imgExt = (ext === 'jpg' || ext === 'jpeg') ? 'jpeg' : 'png';

            // [v0.28] 측정위치 마커 합성 — 성공 시 합성본(PNG) 사용, 실패 시 원본
            let useBuf = buf, useExt = imgExt;
            const specs = _specsByPartId[part.id] || [];
            const markers = specs
              .filter(s => s.marker_x != null && s.marker_y != null)
              .map(s => ({ no: s.item_no, x: s.marker_x, y: s.marker_y }));
            if(markers.length){
              const comp = await compositeMarkers(buf, imgExt, markers);
              if(comp){ useBuf = comp; useExt = 'png'; log(`    🔴 마커 ${markers.length}개 합성`, 'ok'); }
              else { log(`    ⚠ 마커 합성 실패 → 원본 도면 사용`, 'warn'); }
            }

            // 1) 이미지 자연 크기 (비율용)
            const dims = await getImageDimensions(useBuf, useExt);
            const imgRatio = dims.width / dims.height;
            
            // 2) 영역 = C14:AG25
            //    ExcelJS 분수 좌표 규칙: row=N → (N+1)행 시작점
            //      row=13 → 14행 시작 (위쪽 경계)
            //      row=25 → 26행 시작 = 25행의 끝점 (아래쪽 경계)
            //    C(3) ~ AG(33) 31 컬럼, 14~25행 12개 행
            const colStart = 2;   // C 시작
            const colEnd   = 33;  // AH 시작 (= AG 끝)
            const rowStart = 13;  // 14행 시작
            const rowEnd   = 25;  // 26행 시작 (= 25행 끝)
            const areaCols = colEnd - colStart;  // 31
            const areaRows = rowEnd - rowStart;  // 12
            
            // 실측 영역 비율 (마스터 템플릿 기준)
            // 너비: 31컬럼 * 평균 3.05char ≈ 94.69 char ≈ 663px
            // 높이: 12행 * 15.2pt ≈ 182pt ≈ 243px (단, 25행은 17.4pt)
            // 정확히는 14~24=15pt*11=165pt, 25=17.4pt → 합 182.4pt = 243.2px
            // 비율 = 663 / 243 = 2.73
            const AREA_RATIO = 2.73;
            
            // 3) fit 계산 (영역 전체를 1.0으로 두고)
            //    이미지가 영역보다 가로로 길쭉 (imgRatio > AREA_RATIO) → 가로 가득, 세로 축소
            //    이미지가 영역보다 세로로 길쭉 (imgRatio < AREA_RATIO) → 세로 가득, 가로 축소
            let fillW, fillH;
            if(imgRatio > AREA_RATIO){
              fillW = 1.0;
              fillH = AREA_RATIO / imgRatio;
            } else {
              fillH = 1.0;
              fillW = imgRatio / AREA_RATIO;
            }
            
            // 4) 안전 margin 5%
            fillW *= 0.95;
            fillH *= 0.95;
            
            // 5) 중앙 정렬
            const padW = (1.0 - fillW) / 2;
            const padH = (1.0 - fillH) / 2;
            
            // 6) 분수 셀 좌표
            const tlCol = colStart + areaCols * padW;
            const tlRow = rowStart + areaRows * padH;
            const brCol = colStart + areaCols * (padW + fillW);
            const brRow = rowStart + areaRows * (padH + fillH);
            
            const imgId = wb.addImage({buffer: useBuf, extension: useExt});
            ws.addImage(imgId, {
              tl: {col: tlCol, row: tlRow},
              br: {col: brCol, row: brRow},
              editAs: 'oneCell'
            });
            ws.getCell('B14').value = 'SKETCH';
          }catch(e){
            log(`    ❌ 도면 삽입 실패: ${e.message}`, 'err');
          }
        }
      }
      
      log(`  ✅ ${name}`, 'ok');
    }
    
    setProgress(95, '파일 저장 중...');
    log('파일 저장 중...');
    const out = await wb.xlsx.writeBuffer();
    const blob = new Blob([out], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    
    const fname = shipDate.replace(/-/g,'') + '.xlsx';
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fname; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    
    setProgress(100, '✅ 완료');
    log(`✅ ${fname} 다운로드 (${(blob.size/1024).toFixed(1)}KB, 시트 ${usedNames.size}개)`, 'ok');

    // [v0.18] 측정값 누락 항목 경고 — 다운로드는 됐지만 빈 항목이 있으면 알림
    if(allWarnings.length){
      let total = 0;
      allWarnings.forEach(w => total += w.items.length);
      log(`⚠ 측정값이 비어있는 항목 ${total}건 발견 — 확인 필요`, 'err');
      const lines = [];
      allWarnings.forEach(w => {
        w.items.forEach(it => {
          log(`   • [${w.sheet}] No.${it.no} ${it.name} (행 ${it.row}, 빈칸 ${it.empty}개)`, 'err');
          lines.push(`• [${w.sheet}] No.${it.no} ${it.name}`);
        });
      });
      setStatus(`⚠ 측정값 누락 ${total}건 — 로그 확인`, '#fca5a5');
      const preview = lines.slice(0, 15).join('\n') + (lines.length > 15 ? `\n…외 ${lines.length-15}건` : '');
      alert(`⚠ 측정값이 비어있는 항목이 ${total}건 있습니다.\n항목은 있는데 측정값이 안 채워진 행이에요.\n\n${preview}\n\n자세한 목록은 로그 영역을 확인하세요.`);
    }
  }catch(e){
    log('❌ 오류: '+e.message, 'err');
    console.error(e);
    setProgress(0, '실패');
  }finally{
    btn.disabled = false;
  }
}
